<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="麥克風喇叭">
<meta name="theme-color" content="#14213d">
<title>麥克風 → 喇叭</title>
<style>
  :root {
    --bg: #f4f6fb; --fg: #14213d; --muted: #5b6477;
    --accent: #2a6df4; --stop: #d6336c; --card: #ffffff; --line: #d9deea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1424; --fg: #eef1f8; --muted: #9aa4bb; --card: #18203a; --line: #2a3556; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    gap: 28px;
  }
  h1 { font-size: 1.3rem; margin: 0; font-weight: 600; }
  #btn {
    width: 190px; height: 190px; border-radius: 50%; border: 0;
    background: var(--accent); color: #fff; font-size: 1.6rem; font-weight: 600;
    box-shadow: 0 0 0 0 rgba(42,109,244,.5);
    transition: background .2s, transform .1s;
  }
  #btn:active { transform: scale(.96); }
  #btn.on { background: var(--stop); animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(214,51,108,.5); }
    100% { box-shadow: 0 0 0 36px rgba(214,51,108,0); }
  }
  @media (prefers-reduced-motion: reduce) { #btn.on { animation: none; } }
  .panel {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  label { display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
  input[type=range] { width: 100%; }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: .95rem; }
  #meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width .06s; }
  #msg { color: var(--muted); font-size: .85rem; text-align: center; max-width: 380px; min-height: 1.2em; line-height: 1.5; }
  #msg.err { color: var(--stop); }
</style>
</head>
<body>
  <h1>麥克風 → 喇叭</h1>
  <button id="btn">開始</button>

  <div class="panel">
    <label>音量 <span id="gv">100%</span>
      <input id="gain" type="range" min="0" max="3" step="0.05" value="1">
    </label>
    <div id="meter"><div id="bar"></div></div>
    <div class="row">
      <span>回音消除（減少嘯叫）</span>
      <input id="aec" type="checkbox" checked>
    </div>
  </div>

  <div id="msg">請戴耳機使用，否則會嘯叫。</div>

<script>
(function () {
  const btn = document.getElementById('btn');
  const gainEl = document.getElementById('gain');
  const gv = document.getElementById('gv');
  const aec = document.getElementById('aec');
  const bar = document.getElementById('bar');
  const msg = document.getElementById('msg');

  let ctx = null, stream = null, gainNode = null, analyser = null, raf = 0, wake = null;
  let running = false;

  function say(t, err) { msg.textContent = t; msg.className = err ? 'err' : ''; }

  gainEl.addEventListener('input', () => {
    gv.textContent = Math.round(gainEl.value * 100) + '%';
    if (gainNode) gainNode.gain.value = parseFloat(gainEl.value);
  });

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('此瀏覽器不支援麥克風，或網址不是 https。', true);
      return;
    }
    try {
      const on = aec.checked;
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: on, noiseSuppression: on, autoGainControl: false, channelCount: 1 }
      });
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({ latencyHint: 'interactive' });
      await ctx.resume();

      const src = ctx.createMediaStreamSource(stream);
      gainNode = ctx.createGain();
      gainNode.gain.value = parseFloat(gainEl.value);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 256;

      src.connect(gainNode);
      gainNode.connect(analyser);
      gainNode.connect(ctx.destination);

      drawMeter();
      try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}

      running = true;
      btn.textContent = '停止';
      btn.classList.add('on');
      aec.disabled = true;
      say('播放中。保持畫面開啟，螢幕關閉可能會停止。');
    } catch (e) {
      say(e && e.name === 'NotAllowedError'
        ? '麥克風被拒絕。請到「設定 → Safari → 麥克風」允許此網站。'
        : '無法啟動：' + (e && e.message ? e.message : e), true);
      cleanup();
    }
  }

  function drawMeter() {
    const buf = new Uint8Array(analyser.fftSize);
    (function loop() {
      analyser.getByteTimeDomainData(buf);
      let peak = 0;
      for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
      bar.style.width = Math.min(100, (peak / 128) * 140) + '%';
      raf = requestAnimationFrame(loop);
    })();
  }

  function cleanup() {
    cancelAnimationFrame(raf);
    bar.style.width = '0';
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) ctx.close();
    if (wake) { wake.release().catch(() => {}); wake = null; }
    stream = ctx = gainNode = analyser = null;
    running = false;
    btn.textContent = '開始';
    btn.classList.remove('on');
    aec.disabled = false;
  }

  btn.addEventListener('click', () => {
    if (running) { cleanup(); say('已停止。請戴耳機使用，否則會嘯叫。'); }
    else start();
  });

  // 切回畫面時，重新取得螢幕常亮
  document.addEventListener('visibilitychange', async () => {
    if (running && document.visibilityState === 'visible' && navigator.wakeLock) {
      try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    if (running && ctx && ctx.state === 'suspended') ctx.resume();
  });
})();
</script>
</body>
</html>
